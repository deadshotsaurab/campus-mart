name: campus_mart
description: "Campus Mart - OLX-like marketplace for campus communities"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.6

  # Backend & Auth
  supabase_flutter: ^2.5.4
  google_sign_in: ^6.2.1

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # UI Enhancements
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  photo_view: ^0.15.0
  badges: ^3.1.2
  flutter_svg: ^2.0.10+1

  # Utilities
  image_picker: ^1.1.2
  uuid: ^4.4.0
  intl: ^0.19.0
  timeago: ^3.6.1
  shared_preferences: ^2.3.1
  path: ^1.9.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/